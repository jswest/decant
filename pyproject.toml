[project]
name = "decant"
version = "0.1.0"
description = "Pour the clear liquid off; leave the sediment behind. URL -> clean markdown + optional local-LLM findings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John West" }]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "playwright>=1.45",
    "trafilatura>=1.12",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "html2text>=2024.2.26",
    "protego>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
decant = "decant.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Post-install: run `uv run playwright install chromium` once to fetch the headless browser.
